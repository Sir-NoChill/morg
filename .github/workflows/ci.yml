name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace

  test:
    name: Rust Tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  stylua:
    name: StyLua
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check for Lua sources
        id: lua-check
        run: |
          if [ -d "morg-mode-nvim/lua" ] || [ -d "morg-mode-nvim/plugin" ] || [ -d "morg-mode-nvim/spec" ]; then
            echo "has_lua=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_lua=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: JohnnyMorganz/stylua-action@v4
        if: steps.lua-check.outputs.has_lua == 'true'
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --check morg-mode-nvim/lua morg-mode-nvim/plugin morg-mode-nvim/spec

  # Neovim plugin tests — only run when the plugin source tree is present.
  # The plugin was moved to a separate repo (commit 12c3fb6); this job is
  # kept so it automatically re-activates if the directory is restored.
  nvim-plugin-tests:
    name: Neovim Plugin Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check for plugin source
        id: plugin-check
        run: |
          if [ -d "morg-mode-nvim" ]; then
            echo "has_plugin=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_plugin=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: rhysd/action-setup-vim@v1
        if: steps.plugin-check.outputs.has_plugin == 'true'
        with:
          neovim: true
          version: stable
      - uses: actions/setup-python@v5
        if: steps.plugin-check.outputs.has_plugin == 'true'
        with:
          python-version: '3.x'
      - name: Setup Lua test environment (hererocks)
        if: steps.plugin-check.outputs.has_plugin == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libreadline-dev
          pip install hererocks
          # Use PUC Lua 5.1 (not LuaJIT) for luarocks itself — LuaJIT hits
          # a 65536 constant limit parsing the luarocks manifest.
          # Tests still run under Neovim's LuaJIT via nlua.
          hererocks .lua-env --lua 5.1 --luarocks latest
          .lua-env/bin/luarocks install busted
          .lua-env/bin/luarocks install nlua
          .lua-env/bin/luarocks install luafilesystem
      - name: Run plugin tests
        if: steps.plugin-check.outputs.has_plugin == 'true'
        working-directory: morg-mode-nvim
        run: |
          export PATH="$GITHUB_WORKSPACE/.lua-env/bin:$PATH"
          eval "$($GITHUB_WORKSPACE/.lua-env/bin/luarocks path)"
          busted .

  # Nix-based CI (reproducible, uses flake devShell)
  nix:
    name: Nix Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixpkgs-unstable
      - uses: cachix/cachix-action@v15
        with:
          name: nix-community
          skipPush: true
      - name: Rust tests (nix)
        run: nix develop --command cargo test --workspace
      - name: Neovim plugin tests (nix)
        run: |
          if [ -d "morg-mode-nvim" ]; then
            nix develop .#lua-tests --command bash -c "cd morg-mode-nvim && busted ."
          else
            echo "morg-mode-nvim not present, skipping Lua tests"
          fi
