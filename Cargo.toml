[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.85.0"
version = "0.1.0"
authors = ["Sir-NoChill <git@blobfish.icu>"]
categories = ["command-line-utilities", "text-processing", "parser-implementations"]
keywords = ["org-mode", "markdown", "tags", "todo", "time-tracking"]
description = "A markdown-idiomatic replacement for Emacs org-mode: tag system, todos, time tracking, agenda, and literate programming"
documentation = "https://docs.rs/morg-parser"
homepage = "https://github.com/Sir-NoChill/morg-mode"
repository = "https://github.com/Sir-NoChill/morg-mode"
license = "Unlicense"
readme = "README.md"

exclude = [".github/", "docs/", "scripts/", "*.yml", "*.lock", "flake.nix", "pyproject.toml"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
clap = { version = "4", features = ["derive"] }
