[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
# rust-version = "1.70.0"
version = "0.1.0"
authors = ["Sir-NoChill <git@blobfish.icu>"]
categories = []
keywords = []
description = "Morg-mode: A markdown equivalent for org-mode"
documentation = "https://sir-nochill.github.io/morg-mode"
# homepage = "https://sir-nochill.github.io/morg-mode"
repository = "https://github.com/Sir-NoChill/morg-mode"
license = "Unlicense"
readme = "README.md"

exclude = [".github/"]
# include = [ "*" ]
# publish = ["crates.io"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
clap = { version = "4", features = ["derive"] }
